# 每 5 分钟访问一次网站，防止 Render 免费版休眠（15 分钟无流量会冷启动）
name: Keep Render Awake
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping tiku-trainer
        run: curl -sS -o /dev/null -w "%{http_code}\n" https://tiku-trainer.onrender.com/login || true
